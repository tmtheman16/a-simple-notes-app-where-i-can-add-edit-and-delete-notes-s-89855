<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NoteMate</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-background text-text font-body">
<header class="bg-primary text-white p-4">
  <div class="container mx-auto flex justify-between items-center">
    <h1 class="text-2xl font-bold">NoteMate</h1>
    <nav>
      <ul class="flex space-x-4">
        <li><a href="#home" class="hover:text-accent">Home</a></li>
        <li><a href="#add" class="hover:text-accent">Add/Edit</a></li>
        <li><a href="#folders" class="hover:text-accent">Folders</a></li>
        <li><a href="#settings" class="hover:text-accent">Settings</a></li>
      </ul>
    </nav>
  </div>
</header>
<div class="container mx-auto p-4">
  <main id="app">
    <!-- Home Screen -->
    <section id="home" class="hidden">
      <h2 class="text-xl font-bold mb-4">Notes</h2>
      <div id="notes" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      <h2 class="text-xl font-bold mb-4">Folders</h2>
      <div id="folders" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </section>
    <!-- Add/Edit Note Screen -->
    <section id="add" class="hidden">
      <h2 class="text-xl font-bold mb-4">Add/Edit Note</h2>
      <form id="noteForm">
        <div class="mb-4">
          <label for="title" class="block text-sm font-medium text-text">Title</label>
          <input type="text" id="title" name="title" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm focus:ring-accent focus:border-accent sm:text-sm" required>
        </div>
        <div class="mb-4">
          <label for="content" class="block text-sm font-medium text-text">Content</label>
          <textarea id="content" name="content" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm focus:ring-accent focus:border-accent sm:text-sm" required></textarea>
        </div>
        <div class="mb-4">
          <label for="folder" class="block text-sm font-medium text-text">Folder</label>
          <select id="folder" name="folder" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm focus:ring-accent focus:border-accent sm:text-sm">
            <option value="">None</option>
          </select>
        </div>
        <button type="submit" class="bg-accent text-white py-2 px-4 rounded-md hover:bg-accent-hover">Save</button>
      </form>
    </section>
    <!-- Folder Screen -->
    <section id="folders" class="hidden">
      <h2 class="text-xl font-bold mb-4">Folders</h2>
      <div id="folderList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      <button id="addFolderBtn" class="bg-accent text-white py-2 px-4 rounded-md hover:bg-accent-hover">Add Folder</button>
    </section>
    <!-- Settings Screen -->
    <section id="settings" class="hidden">
      <h2 class="text-xl font-bold mb-4">Settings</h2>
      <div class="mb-4">
        <label for="sync" class="block text-sm font-medium text-text">Sync</label>
        <input type="checkbox" id="sync" name="sync" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm focus:ring-accent focus:border-accent sm:text-sm">
      </div>
      <div class="mb-4">
        <label for="export" class="block text-sm font-medium text-text">Export</label>
        <select id="export" name="export" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm focus:ring-accent focus:border-accent sm:text-sm">
          <option value="text">Text</option>
          <option value="html">HTML</option>
        </select>
      </div>
    </section>
  </main>
</div>
<footer class="bg-primary text-white p-4 text-center">
  <p>Sync status: <span id="syncStatus">Offline</span></p>
</footer>
<script src="js/app.js"></script>
</body>
</html>
